server:
  controllers:
    main:
      containers:
        main:
          image:
            tag: v2.4.1
            pullPolicy: IfNotPresent
          # Elevated hardware security permission
          securityContext:
            privileged: true
          env:
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db-superuser
                  key: user
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db-superuser
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: dbname

# iGPU
persistence:
  dev-dri:
    enabled: true
    type: hostPath
    hostPath: /dev/dri
    advancedMounts:
      main:
        main:
          - path: /dev/dri

valkey:
  enabled: true

immich:
  persistence:
    library:
      existingClaim: immich-library-pvc

machine-learning:
  enabled: false

ingress:
  main:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: immich.local.koryalbert.net
        paths:
          - path: "/"
            pathType: Prefix
            service:
              name: immich-server
              port: 2283
    tls:
      - secretName: immich-tls-cert
        hosts:
          - immich.local.koryalbert.net