apiVersion: v1
kind: Service
metadata:
  name: external-pve-svc
  namespace: default
spec:
  ports:
    - protocol: TCP
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: external-pve-svc
  namespace: default
  labels:
    kubernetes.io/service-name: external-pve-svc
addressType: IPv4
ports:
  - port: 8006
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.2.250
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-proxy-pve
  namespace: default
spec:
  parentRefs:
    - name: gateway-local-koryalbert
      namespace: gateway
      sectionName: local-koryalbert-net
  hostnames:
    - "pve.local.koryalbert.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: external-pve-svc
          port: 8006

