apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actualbudget-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - budget.local.koryalbert.net
    secretName: budget-local-tls-cert 
  rules:
  - host: budget.local.koryalbert.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: actual-budget
            port:
              number: 5006