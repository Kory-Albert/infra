apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-app-pvc
  namespace: ghost-dmz
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghost-db-pvc
  namespace: ghost-dmz
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi