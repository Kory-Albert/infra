apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: ai
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
      - name: whisper
        image: lscr.io/linuxserver/faster-whisper:latest
        ports:
        - containerPort: 10300
        env:
        - name: WHISPER_MODEL
          value: tiny-int8
        - name: WHISPER_LANG
          value: en