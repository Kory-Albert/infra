apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  type: ClusterIP
  selector:
    name: ollama
  ports:
  - port: 80
    name: http
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: ollama
spec:
  type: ClusterIP
  selector:
    name: webui
  ports:
  - port: 80
    name: http
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-nodeport
  namespace: ai
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: http
    protocol: TCP
    nodePort: 32627