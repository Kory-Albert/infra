apiVersion: apps/v1
kind: Deployment
metadata:
  name: podhelper
spec:
  selector:
    matchLabels:
      app: podhelper
  template:
    metadata:
      labels:
        app: podhelper
    spec:
      nodeName: k8s-node-1
      containers:
        - name: podhelper
          image: jonlabelle/network-tools
          imagePullPolicy: IfNotPresent
          command: [ "/bin/bash", "-c", "--" ]
          args: [ "while true; do sleep 30; done;" ]
          ports:
          - containerPort: 22
          volumeMounts:
            - name: viewdata
              mountPath: /mnt
#            - name: viewdata2
#              mountPath: /media
      volumes:
        - name: viewdata
          persistentVolumeClaim:
            claimName: speedtest-db-nfs-pvc #name of PVC
#        - name: viewdata2
#          persistentVolumeClaim:
#            claimName: #name of PVC