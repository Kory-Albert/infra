apiVersion: v1
kind: Service
metadata:
  name: cookbook-db
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: cookbook-db
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cookbook-app
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: cookbook-app
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cookbook-web
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: cookbook-web
  type: ClusterIP